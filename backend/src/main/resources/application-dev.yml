# =============================================================================
# application-dev.yml - Smart Campus Operations Hub
# IT3030 PAF 2026 | SLIIT
#
# Development profile overrides.
# Activated when: spring.profiles.active=dev (set in application.yml)
#
# Purpose: verbose SQL logging and DEBUG-level output to aid local development.
# DO NOT use this profile in production - it leaks query parameters to logs.
# =============================================================================

spring:
  # JPA / Hibernate (dev overrides)
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Google OAuth2 Credentials
  # Real values are injected via environment variables
  # Set before running: $env:GOOGLE_CLIENT_ID and $env:GOOGLE_CLIENT_SECRET
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Logging
logging:
  level:
    com.smartcampus: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework: INFO
    org.springframework.web: INFO
